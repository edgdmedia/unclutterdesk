<!-- @dsCard group="Components" viewport="700x220" name="Brand" subtitle="Mark, lockup, powered-by line" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../ui_kits/_shared/load-components.js"></script>
<style>
  body { background: var(--desk-card); padding: 22px 24px; }
  .lbl { font-size: 9px; font-weight: 900; text-transform: uppercase; letter-spacing: .22em; color: var(--desk-text-subtle); }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/plain" id="demo">

/* Primitives are bound when the loader resolves. */
let Logo;
const B = '../../';

function Demo() {
  ({ Logo } = window.DESK);
  return (
    <div style={{display:'flex', flexDirection:'column', gap:18}}>
      <div style={{display:'flex', alignItems:'center', gap:26, flexWrap:'wrap'}}>
        <div style={{display:'flex', flexDirection:'column', gap:9}}>
          <div className="lbl">Mark</div>
          <div style={{display:'flex', alignItems:'flex-end', gap:14}}>
            <Logo variant="mark" size={76} assetBase={B} />
            <Logo variant="mark" size={44} assetBase={B} />
            <Logo variant="mark" size={30} assetBase={B} />
          </div>
        </div>
        <div style={{display:'flex', flexDirection:'column', gap:9}}>
          <div className="lbl">Lockup — on light</div>
          <Logo variant="lockup" size={34} assetBase={B} onDark={false} />
          <img src={B + 'assets/unclutterdesk-lockup.svg'} alt="unclutter DESK" style={{width:260, display:'block'}} />
        </div>
      </div>

      <div style={{display:'flex', gap:16, flexWrap:'wrap'}}>
        <div style={{background:'var(--desk-sidebar)', borderRadius:18, padding:'16px 18px', display:'flex', flexDirection:'column', gap:10}}>
          <div className="lbl" style={{color:'var(--desk-text-muted)'}}>Lockup — on slate</div>
          <Logo variant="lockup" size={30} assetBase={B} />
        </div>
        <div style={{flex:1, minWidth:240, background:'var(--desk-surface)', border:'1px solid var(--desk-border)',
                     borderRadius:18, padding:'16px 18px', display:'flex', flexDirection:'column', gap:10}}>
          <div className="lbl">Public footer — the only Desk branding on a tenant page</div>
          <Logo variant="poweredBy" assetBase={B} />
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
<script>
  /* Babel's script-tag transformer doesn't execute here, so compile the demo
     ourselves once the primitives are loaded. */
  loadDeskComponents('../../').then(() => {
    const src = document.getElementById('demo').textContent;
    (0, eval)(Babel.transform(src, { presets: [['react', { runtime: 'classic' }]] }).code);
  });
</script>
</body>
</html>
