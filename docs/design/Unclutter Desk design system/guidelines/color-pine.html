<!-- @dsCard group="Colors" viewport="700x150" name="Brand — Pine" subtitle="Primary ramp, derived from Unclutter sage pushed darker and more saturated" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pine</title>
<link rel="stylesheet" href="../styles.css">
<style>
  body { background: var(--desk-card); padding: 18px 20px; font-family: var(--font-primary); }
  .row { display: flex; gap: 8px; align-items: flex-start; }
  .sw { flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .chip { height: 58px; border-radius: 12px; }
  .hex { font-family: var(--font-mono); font-size: 10px; font-weight: 600; color: var(--desk-text); }
  .use { font-size: 9.5px; color: var(--desk-text-subtle); line-height: 1.35; }
  .tok { font-family: var(--font-mono); font-size: 9.5px; color: var(--desk-text-muted); }
</style>
</head>
<body>
<div class="row">
  <div class="sw"><div class="chip" style="background:#0E2A22;"></div><div class="hex">0E2A22</div><div class="use">900 · badge text</div></div>
  <div class="sw"><div class="chip" style="background:#143A2F;"></div><div class="hex">143A2F</div><div class="use">800 · wordmark</div></div>
  <div class="sw"><div class="chip" style="background:#1C4E3F;"></div><div class="hex">1C4E3F</div><div class="use">700 · hover</div></div>
  <div class="sw"><div class="chip" style="background:#24614F;box-shadow:0 0 0 3px rgba(36,97,79,.20)"></div><div class="hex">24614F</div><div class="use">600 · PRIMARY</div></div>
  <div class="sw"><div class="chip" style="background:#2E7A63;"></div><div class="hex">2E7A63</div><div class="use">500 · links</div></div>
  <div class="sw"><div class="chip" style="background:#4A9781;"></div><div class="hex">4A9781</div><div class="use">400 · nav marker</div></div>
  <div class="sw"><div class="chip" style="background:#7DB8A5;"></div><div class="hex">7DB8A5</div><div class="use">300 · linework</div></div>
  <div class="sw"><div class="chip" style="background:#B6D8CC;"></div><div class="hex">B6D8CC</div><div class="use">200 · DESK badge</div></div>
  <div class="sw"><div class="chip" style="background:#DDEDE6;"></div><div class="hex">DDEDE6</div><div class="use">100 · soft fill</div></div>
  <div class="sw"><div class="chip" style="background:#F0F7F4;border:1px solid var(--desk-border)"></div><div class="hex">F0F7F4</div><div class="use">050 · surface</div></div>
</div>
</body>
</html>
