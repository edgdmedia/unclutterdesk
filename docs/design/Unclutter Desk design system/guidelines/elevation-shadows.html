<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Elevation</title>
<link rel="stylesheet" href="../styles.css">
<style>
  body { background: var(--desk-surface); padding: 18px 20px; font-family: var(--font-primary); }
  .tok { font-family: var(--font-mono); font-size: 9.5px; color: var(--desk-text-subtle); }
  .lbl { font-size: 9.5px; color: var(--desk-text-subtle); }
</style>
</head>
<body>
<div style="display:flex;gap:12">
  <div style="display:flex;flex-direction:column;gap:7;align-items:center;flex:1">
     <div style="width:100%;height:58px;border-radius:16px;background:#fff;border:1px solid var(--desk-border);box-shadow:0 1px 2px rgba(15,23,42,.05)"></div>
     <div style="font-size:9.5px;color:var(--desk-text-subtle);text-align:center">xs</div></div>
  <div style="display:flex;flex-direction:column;gap:7;align-items:center;flex:1">
     <div style="width:100%;height:58px;border-radius:16px;background:#fff;border:1px solid var(--desk-border);box-shadow:0 1px 3px rgba(15,23,42,.06), 0 1px 2px rgba(15,23,42,.04)"></div>
     <div style="font-size:9.5px;color:var(--desk-text-subtle);text-align:center">sm · cards</div></div>
  <div style="display:flex;flex-direction:column;gap:7;align-items:center;flex:1">
     <div style="width:100%;height:58px;border-radius:16px;background:#fff;border:1px solid var(--desk-border);box-shadow:0 4px 16px rgba(15,23,42,.07)"></div>
     <div style="font-size:9.5px;color:var(--desk-text-subtle);text-align:center">md</div></div>
  <div style="display:flex;flex-direction:column;gap:7;align-items:center;flex:1">
     <div style="width:100%;height:58px;border-radius:16px;background:#fff;border:1px solid var(--desk-border);box-shadow:0 8px 24px rgba(15,23,42,.08)"></div>
     <div style="font-size:9.5px;color:var(--desk-text-subtle);text-align:center">hover</div></div>
  <div style="display:flex;flex-direction:column;gap:7;align-items:center;flex:1">
     <div style="width:100%;height:58px;border-radius:16px;background:#fff;border:1px solid var(--desk-border);box-shadow:0 12px 34px rgba(15,23,42,.09)"></div>
     <div style="font-size:9.5px;color:var(--desk-text-subtle);text-align:center">lg · raised</div></div>
  <div style="display:flex;flex-direction:column;gap:7;align-items:center;flex:1">
     <div style="width:100%;height:58px;border-radius:16px;background:#fff;border:1px solid var(--desk-border);box-shadow:0 24px 80px rgba(15,23,42,.14)"></div>
     <div style="font-size:9.5px;color:var(--desk-text-subtle);text-align:center">frame</div></div>
  <div style="display:flex;flex-direction:column;gap:7;align-items:center;flex:1">
     <div style="width:100%;height:58px;border-radius:16px;background:#fff;border:1px solid var(--desk-border);box-shadow:0 24px 80px rgba(15,23,42,.24)"></div>
     <div style="font-size:9.5px;color:var(--desk-text-subtle);text-align:center">modal</div></div>
</div>
</body>
</html>
