<!-- @dsCard group="Type" viewport="700x190" name="Eyebrow — the signature" subtitle="9px / 900 / 0.22em uppercase, above nearly every card and section" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Eyebrow</title>
<link rel="stylesheet" href="../styles.css">
<style>
  body { background: var(--desk-card); padding: 18px 20px; font-family: var(--font-primary); }
  .tok { font-family: var(--font-mono); font-size: 9.5px; color: var(--desk-text-subtle); }
  .lbl { font-size: 9.5px; color: var(--desk-text-subtle); }
</style>
</head>
<body>
<div style="display:flex;gap:16">
  <div style="flex:1;background:var(--desk-surface);border:1px solid var(--desk-border);border-radius:20px;padding:18px 20px">
    <div style="font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:0.22em;color:var(--desk-text-subtle);line-height:1">Revenue this month</div>
    <div style="font-size:40px;font-weight:800;letter-spacing:-0.04em;margin-top:10px">₦450,000</div>
  </div>
  <div style="flex:1;background:var(--desk-sidebar);border-radius:20px;padding:18px 20px;color:#fff">
    <div style="font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:0.22em;color:rgba(255,255,255,.75);line-height:1">Session summary</div>
    <div style="font-size:17px;font-weight:700;margin-top:10px">Individual Therapy</div>
    <div class="tok" style="color:rgba(255,255,255,.45);margin-top:14px">tone="invert"</div>
  </div>
  <div style="flex:1;background:var(--brand-fill);border-radius:20px;padding:18px 20px">
    <div style="font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:0.22em;color:var(--brand-primary);line-height:1">Dr. Jane Smith Therapy</div>
    <div style="font-size:17px;font-weight:700;margin-top:10px;color:var(--desk-text)">Practice name</div>
    <div class="tok" style="margin-top:14px">tone="tenant"</div>
  </div>
</div>
</body>
</html>
