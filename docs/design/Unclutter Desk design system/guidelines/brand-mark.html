<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mark</title>
<link rel="stylesheet" href="../styles.css">
<style>
  body { background: var(--desk-card); padding: 18px 20px; font-family: var(--font-primary); }
  .tok { font-family: var(--font-mono); font-size: 9.5px; color: var(--desk-text-subtle); }
  .lbl { font-size: 9.5px; color: var(--desk-text-subtle); }
</style>
</head>
<body>
<div style="display:flex;gap:20;align-items:flex-end">
  <img src="../assets/unclutterdesk-mark.svg" alt="Unclutter Desk" style="width:96px;height:96px;border-radius:22px;display:block">
  <img src="../assets/unclutterdesk-mark.svg" alt="" style="width:64px;height:64px;border-radius:16px;display:block">
  <img src="../assets/unclutterdesk-mark.svg" alt="" style="width:44px;height:44px;border-radius:11px;display:block">
  <img src="../assets/unclutterdesk-mark.svg" alt="" style="width:30px;height:30px;border-radius:9px;display:block">
  <div style="display:flex;align-items:center;gap:8;margin-left:16px;margin-bottom:6px">
    <img src="../assets/unclutterdesk-mark.svg" alt="" style="width:16px;height:16px;border-radius:5px;opacity:.6;display:block">
    <span style="font-size:10.5px;color:var(--desk-text-subtle)">Booking powered by Unclutter Desk</span>
  </div>
</div>
<div class="lbl" style="margin-top:14px">Sidebar 30px · powered-by footer 16px at 60% opacity. The powered-by line is the only Desk branding on a tenant's public page.</div>
</body>
</html>
