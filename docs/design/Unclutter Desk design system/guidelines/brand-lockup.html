<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lockup</title>
<link rel="stylesheet" href="../styles.css">
<style>
  body { background: var(--desk-card); padding: 18px 20px; font-family: var(--font-primary); }
  .tok { font-family: var(--font-mono); font-size: 9.5px; color: var(--desk-text-subtle); }
  .lbl { font-size: 9.5px; color: var(--desk-text-subtle); }
</style>

<body>
<div style="display:flex;gap:18;align-items:center">
  <img src="../assets/unclutterdesk-lockup.svg" alt="unclutter DESK" style="width:300px;display:block">
  <div style="background:var(--desk-sidebar);border-radius:18px;padding:16px 18px;display:flex;align-items:center;gap:9px">

    <span style="font-size:17px;font-weight:600;letter-spacing:-0.02em;color:#F8FAFC">unclutter</span>
