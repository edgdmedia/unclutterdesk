<!-- @dsCard group="Spacing" viewport="700x140" name="Radius" subtitle="One radius per role — don't reach past this set" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Radius</title>
<link rel="stylesheet" href="../styles.css">
<style>
  body { background: var(--desk-card); padding: 18px 20px; font-family: var(--font-primary); }
  .tok { font-family: var(--font-mono); font-size: 9.5px; color: var(--desk-text-subtle); }
  .lbl { font-size: 9.5px; color: var(--desk-text-subtle); }
</style>
</head>
<body>
<div style="display:flex;gap:14;flex-wrap:wrap">
  <div style="display:flex;flex-direction:column;gap:6;align-items:center">
    <div style="width:74px;height:56px;border-radius:24px;background:var(--desk-surface);border:1px solid var(--desk-border)"></div>
    <div style="font-family:var(--font-mono);font-size:10px;font-weight:600">24px</div>
    <div style="font-size:9.5px;color:var(--desk-text-subtle)">card</div></div>
  <div style="display:flex;flex-direction:column;gap:6;align-items:center">
    <div style="width:74px;height:56px;border-radius:22px;background:var(--desk-surface);border:1px solid var(--desk-border)"></div>
    <div style="font-family:var(--font-mono);font-size:10px;font-weight:600">22px</div>
    <div style="font-size:9.5px;color:var(--desk-text-subtle)">panel</div></div>
  <div style="display:flex;flex-direction:column;gap:6;align-items:center">
    <div style="width:74px;height:56px;border-radius:20px;background:var(--desk-surface);border:1px solid var(--desk-border)"></div>
    <div style="font-family:var(--font-mono);font-size:10px;font-weight:600">20px</div>
    <div style="font-size:9.5px;color:var(--desk-text-subtle)">nested / KPI</div></div>
  <div style="display:flex;flex-direction:column;gap:6;align-items:center">
    <div style="width:74px;height:56px;border-radius:18px;background:var(--desk-surface);border:1px solid var(--desk-border)"></div>
    <div style="font-family:var(--font-mono);font-size:10px;font-weight:600">18px</div>
    <div style="font-size:9.5px;color:var(--desk-text-subtle)">list row</div></div>
  <div style="display:flex;flex-direction:column;gap:6;align-items:center">
    <div style="width:74px;height:56px;border-radius:14px;background:var(--desk-surface);border:1px solid var(--desk-border)"></div>
    <div style="font-family:var(--font-mono);font-size:10px;font-weight:600">14px</div>
    <div style="font-size:9.5px;color:var(--desk-text-subtle)">control</div></div>
  <div style="display:flex;flex-direction:column;gap:6;align-items:center">
    <div style="width:74px;height:56px;border-radius:12px;background:var(--desk-surface);border:1px solid var(--desk-border)"></div>
    <div style="font-family:var(--font-mono);font-size:10px;font-weight:600">12px</div>
    <div style="font-size:9.5px;color:var(--desk-text-subtle)">chip</div></div>
  <div style="display:flex;flex-direction:column;gap:6;align-items:center">
    <div style="width:74px;height:56px;border-radius:10px;background:var(--desk-surface);border:1px solid var(--desk-border)"></div>
    <div style="font-family:var(--font-mono);font-size:10px;font-weight:600">10px</div>
    <div style="font-size:9.5px;color:var(--desk-text-subtle)">small</div></div>
  <div style="display:flex;flex-direction:column;gap:6;align-items:center">
    <div style="width:74px;height:56px;border-radius:999px;background:var(--desk-surface);border:1px solid var(--desk-border)"></div>
    <div style="font-family:var(--font-mono);font-size:10px;font-weight:600">999px</div>
    <div style="font-size:9.5px;color:var(--desk-text-subtle)">pill</div></div>
</div>
</body>
</html>
