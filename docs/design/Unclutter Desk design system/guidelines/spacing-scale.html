<!DOCTYPE html>
<html lang="en">
<head>

<title>Spacing</title>
<link rel="stylesheet" href="../styles.css">
<style>

  <div style="display:flex;flex-direction:column;gap:6;align-items:flex-start">
     <div style="width:24px;height:26px;border-radius:4px;background:var(--desk-pine-200)"></div>

     <div style="width:40px;height:26px;border-radius:4px;background:var(--desk-pine-200)"></div>
