<!-- @dsCard group="Colors" viewport="700x150" name="Slate chrome" subtitle="Product chrome — never tenant-themed. Unchanged from the previous system." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Slate</title>
<link rel="stylesheet" href="../styles.css">
<style>
  body { background: var(--desk-card); padding: 18px 20px; font-family: var(--font-primary); }
  .row { display: flex; gap: 8px; align-items: flex-start; }
  .sw { flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .chip { height: 58px; border-radius: 12px; }
  .hex { font-family: var(--font-mono); font-size: 10px; font-weight: 600; color: var(--desk-text); }
  .use { font-size: 9.5px; color: var(--desk-text-subtle); line-height: 1.35; }
  .tok { font-family: var(--font-mono); font-size: 9.5px; color: var(--desk-text-muted); }
</style>
</head>
<body>
<div class="row">
  <div class="sw"><div class="chip" style="background:#0F172A;"></div><div class="hex">0F172A</div><div class="use">sidebar · dark hero</div></div>
  <div class="sw"><div class="chip" style="background:#1E293B;"></div><div class="hex">1E293B</div><div class="use">sidebar hover</div></div>
  <div class="sw"><div class="chip" style="background:#475569;"></div><div class="hex">475569</div><div class="use">body text</div></div>
  <div class="sw"><div class="chip" style="background:#64748B;"></div><div class="hex">64748B</div><div class="use">muted text</div></div>
  <div class="sw"><div class="chip" style="background:#94A3B8;"></div><div class="hex">94A3B8</div><div class="use">eyebrow · subtle</div></div>
  <div class="sw"><div class="chip" style="background:#CBD5E1;"></div><div class="hex">CBD5E1</div><div class="use">border strong</div></div>
  <div class="sw"><div class="chip" style="background:#E2E8F0;"></div><div class="hex">E2E8F0</div><div class="use">border</div></div>
  <div class="sw"><div class="chip" style="background:#F1F5F9;"></div><div class="hex">F1F5F9</div><div class="use">muted fill</div></div>
  <div class="sw"><div class="chip" style="background:#F8FAFC;border:1px solid var(--desk-border)"></div><div class="hex">F8FAFC</div><div class="use">app surface</div></div>
  <div class="sw"><div class="chip" style="background:#FCFDFE;border:1px solid var(--desk-border)"></div><div class="hex">FCFDFE</div><div class="use">alt surface</div></div>
</div>
</body>
</html>
