<!-- @dsCard group="Spacing" viewport="700x130" name="Control heights" subtitle="sm 32 · md 40 · lg 44 · xl 48 · booking CTA 52" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Controls</title>
<link rel="stylesheet" href="../styles.css">
<style>
  body { background: var(--desk-card); padding: 18px 20px; font-family: var(--font-primary); }
  .tok { font-family: var(--font-mono); font-size: 9.5px; color: var(--desk-text-subtle); }
  .lbl { font-size: 9.5px; color: var(--desk-text-subtle); }
</style>
</head>
<body>
<div style="display:flex;gap:14;align-items:flex-end">
  <div style="display:flex;flex-direction:column;gap:6;align-items:center">
     <div style="width:96px;height:32px;border-radius:14px;background:var(--brand-primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700">32px</div>
     <div style="font-size:9.5px;color:var(--desk-text-subtle)">sm</div></div>
  <div style="display:flex;flex-direction:column;gap:6;align-items:center">
     <div style="width:96px;height:40px;border-radius:14px;background:var(--brand-primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700">40px</div>
     <div style="font-size:9.5px;color:var(--desk-text-subtle)">md</div></div>
  <div style="display:flex;flex-direction:column;gap:6;align-items:center">
     <div style="width:96px;height:44px;border-radius:14px;background:var(--brand-primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700">44px</div>
     <div style="font-size:9.5px;color:var(--desk-text-subtle)">lg</div></div>
  <div style="display:flex;flex-direction:column;gap:6;align-items:center">
     <div style="width:96px;height:48px;border-radius:14px;background:var(--brand-primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700">48px</div>
     <div style="font-size:9.5px;color:var(--desk-text-subtle)">xl</div></div>
  <div style="display:flex;flex-direction:column;gap:6;align-items:center">
     <div style="width:96px;height:52px;border-radius:16px;background:var(--brand-primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700">52px</div>
     <div style="font-size:9.5px;color:var(--desk-text-subtle)">booking CTA</div></div>
</div>
</body>
</html>
