<!-- @dsCard group="Colors" viewport="700x150" name="Secondary & accent" subtitle="Clay is the second tenant slot default; brass is the one rare gold" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Secondary</title>
<link rel="stylesheet" href="../styles.css">
<style>
  body { background: var(--desk-card); padding: 18px 20px; font-family: var(--font-primary); }
  .row { display: flex; gap: 8px; align-items: flex-start; }
  .sw { flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .chip { height: 58px; border-radius: 12px; }
  .hex { font-family: var(--font-mono); font-size: 10px; font-weight: 600; color: var(--desk-text); }
  .use { font-size: 9.5px; color: var(--desk-text-subtle); line-height: 1.35; }
  .tok { font-family: var(--font-mono); font-size: 9.5px; color: var(--desk-text-muted); }
</style>
</head>
<body>
<div class="row">
  <div class="sw"><div class="chip" style="background:#6F4830;"></div><div class="hex">6F4830</div><div class="use">clay 700 · hover</div></div>
  <div class="sw"><div class="chip" style="background:#8A5A3C;"></div><div class="hex">8A5A3C</div><div class="use">clay 600 · SECONDARY</div></div>
  <div class="sw"><div class="chip" style="background:#F3EAE3;"></div><div class="hex">F3EAE3</div><div class="use">clay 100 · soft</div></div>
  <div class="sw" style="flex:0 0 14px"></div>
  <div class="sw"><div class="chip" style="background:#B08320;"></div><div class="hex">B08320</div><div class="use">brass · one decorative flourish per surface. Never a badge, nav marker, rating or status.</div></div>
  <div class="sw" style="flex:2"></div>
</div>
</body>
</html>
