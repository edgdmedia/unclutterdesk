<!-- @dsCard group="Colors" viewport="700x130" name="Tenant presets" subtitle="The five Brand Settings pairs — values unchanged; only the first label was renamed" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Presets</title>
<link rel="stylesheet" href="../styles.css">
<style>
  body { background: var(--desk-card); padding: 18px 20px; font-family: var(--font-primary); }
  .row { display: flex; gap: 8px; align-items: flex-start; }
  .sw { flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .chip { height: 58px; border-radius: 12px; }
  .hex { font-family: var(--font-mono); font-size: 10px; font-weight: 600; color: var(--desk-text); }
  .use { font-size: 9.5px; color: var(--desk-text-subtle); line-height: 1.35; }
  .tok { font-family: var(--font-mono); font-size: 9.5px; color: var(--desk-text-muted); }
</style>
</head>
<body>
<div class="row">
  <div class="sw"><div style="height:44px;border-radius:10px;border:2px solid var(--desk-border);display:flex;overflow:hidden">
    <span style="flex:1;background:#0F3A53"></span><span style="flex:1;background:#E3B341"></span></div>
   <div class="hex">Deep navy</div><div class="tok">#0F3A53 · #E3B341</div></div>
  <div class="sw"><div style="height:44px;border-radius:10px;border:2px solid var(--desk-border);display:flex;overflow:hidden">
    <span style="flex:1;background:#007BFF"></span><span style="flex:1;background:#6F42C1"></span></div>
   <div class="hex">Signal blue</div><div class="tok">#007BFF · #6F42C1</div></div>
  <div class="sw"><div style="height:44px;border-radius:10px;border:2px solid var(--desk-border);display:flex;overflow:hidden">
    <span style="flex:1;background:#0E7490"></span><span style="flex:1;background:#F59E0B"></span></div>
   <div class="hex">Calm teal</div><div class="tok">#0E7490 · #F59E0B</div></div>
  <div class="sw"><div style="height:44px;border-radius:10px;border:2px solid var(--desk-border);display:flex;overflow:hidden">
    <span style="flex:1;background:#7C3AED"></span><span style="flex:1;background:#EC4899"></span></div>
   <div class="hex">Deep violet</div><div class="tok">#7C3AED · #EC4899</div></div>
  <div class="sw"><div style="height:44px;border-radius:10px;border:2px solid var(--desk-border);display:flex;overflow:hidden">
    <span style="flex:1;background:#15803D"></span><span style="flex:1;background:#B45309"></span></div>
   <div class="hex">Forest</div><div class="tok">#15803D · #B45309</div></div>
</div>
</body>
</html>
