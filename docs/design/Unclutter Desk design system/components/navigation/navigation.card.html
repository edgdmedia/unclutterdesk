<!-- @dsCard group="Components" viewport="700x400" name="Navigation" subtitle="Sidebar, NavItem, AppHeader, BottomNav" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../ui_kits/_shared/load-components.js"></script>
<style>
  body { background: var(--desk-canvas); padding: 20px; }
  .lbl { font-size: 9px; font-weight: 900; text-transform: uppercase; letter-spacing: .22em; color: var(--desk-text-subtle); margin-bottom: 8px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/plain" id="demo">

/* Primitives are bound when the loader resolves. */
let Sidebar, AppHeader, BottomNav, Button, IconButton;

const I = ({d, s=18}) => (
  <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor"
       strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d={d}/></svg>
);
const P = {
  home: "M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z",
  cal:  "M8 2v4M16 2v4M3 9h18M5 5h14a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z",
  users:"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M22 21v-2a4 4 0 0 0-3-3.87",
  brush:"M4 20c2-1 3-3 3-5a3 3 0 1 1 5 2M14 12l7-7a2 2 0 0 0-3-3l-7 7",
  chart:"M3 3v18h18M7 15l4-5 3 3 5-7",
  bell: "M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0",
};

function Demo() {
  ({ Sidebar, AppHeader, BottomNav, Button, IconButton } = window.DESK);
  const [screen, setScreen] = React.useState('dashboard');
  const [tab, setTab] = React.useState('Today');
  const items = [
    { key:'dashboard', label:'Dashboard', icon:<I d={P.home}/> },
    { key:'schedule',  label:'Schedule',  icon:<I d={P.cal}/>,   count:'4',   countTone:'pine' },
    { key:'clients',   label:'Clients',   icon:<I d={P.users}/>, count:'128' },
    { key:'brand',     label:'Brand Settings', icon:<I d={P.brush}/> },
    { key:'analytics', label:'Analytics', icon:<I d={P.chart}/> },
  ];
  const tabs = [
    { label:'Today',    icon:<I d={P.home} s={20}/> },
    { label:'Schedule', icon:<I d={P.cal} s={20}/> },
    { label:'Clients',  icon:<I d={P.users} s={20}/> },
    { label:'Brand',    icon:<I d={P.brush} s={20}/> },
  ];

  return (
    <div style={{display:'flex', gap:16, alignItems:'flex-start'}}>
      <div>
        <div className="lbl">Sidebar</div>
        <Sidebar items={items} active={screen} onSelect={setScreen} assetBase="../../"
          user={{initials:'JS', name:'Dr. Jane Smith', role:'Clinical Psychologist'}}
          style={{height:330, borderRadius:20, overflow:'hidden'}} />
      </div>
      <div style={{flex:1, display:'flex', flexDirection:'column', gap:16, minWidth:0}}>
        <div>
          <div className="lbl">App header</div>
          <AppHeader eyebrow="Practice" title="Dashboard"
            style={{borderRadius:20, border:'1px solid var(--desk-border)'}}>
            <Button variant="secondary" size="lg">Export</Button>
            <Button variant="primary" size="lg">Copy Booking Link</Button>
            <IconButton size={44} dot aria-label="Notifications"><I d={P.bell}/></IconButton>
          </AppHeader>
        </div>
        <div>
          <div className="lbl">Bottom nav — mobile</div>
          <div style={{width:390, background:'var(--desk-surface)', borderRadius:'20px 20px 24px 24px',
                       border:'1px solid var(--desk-border)', overflow:'hidden', paddingTop:20}}>
            <BottomNav items={tabs} active={tab} onSelect={setTab} />
          </div>
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
<script>
  /* Babel's script-tag transformer doesn't execute here, so compile the demo
     ourselves once the primitives are loaded. */
  loadDeskComponents('../../').then(() => {
    const src = document.getElementById('demo').textContent;
    (0, eval)(Babel.transform(src, { presets: [['react', { runtime: 'classic' }]] }).code);
  });
</script>
</body>
</html>
