<!-- @dsCard group="Components" viewport="700x420" name="Core" subtitle="Button, IconButton, Card, Eyebrow, Badge, StatusPill, AvatarChip" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../ui_kits/_shared/load-components.js"></script>
<style>
  body { background: var(--desk-card); padding: 22px 24px; }
  .grp { display: flex; flex-direction: column; gap: 9px; }
  .lbl { font-size: 9px; font-weight: 900; text-transform: uppercase; letter-spacing: .22em; color: var(--desk-text-subtle); }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/plain" id="demo">

/* Primitives are bound when the loader resolves. */
let Button, IconButton, Card, Eyebrow, Badge, StatusPill, AvatarChip;

const I = ({d, s=15}) => (
  <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor"
       strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d={d}/></svg>
);
const copy = "M8 4h10a2 2 0 0 1 2 2v10M16 8H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V10a2 2 0 0 0-2-2z";
const bell = "M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0";
const dots = "M12 6h.01M12 12h.01M12 18h.01";

function Demo() {
  ({ Button, IconButton, Card, Eyebrow, Badge, StatusPill, AvatarChip } = window.DESK);
  return (
    <div style={{display:'flex', flexDirection:'column', gap:20}}>
      <div className="grp">
        <div className="lbl">Button</div>
        <div className="row">
          <Button variant="primary" icon={<I d={copy}/>}>Copy Booking Link</Button>
          <Button variant="secondary">Set availability</Button>
          <Button variant="link" size="sm">View schedule</Button>
          <Button variant="ghost" size="sm">Cancel</Button>
          <Button variant="tenantSoft" size="sm">Start session</Button>
          <Button variant="danger" size="sm">Delete</Button>
          <Button variant="primary" size="sm" disabled>Disabled</Button>
        </div>
      </div>

      <div className="grp">
        <div className="lbl">Icon button · badge · status</div>
        <div className="row">
          <IconButton size={44} dot aria-label="Notifications"><I d={bell} s={18}/></IconButton>
          <IconButton size={32} variant="plain" aria-label="Copy"><I d={copy} s={14}/></IconButton>
          <IconButton size={32} variant="muted" aria-label="More"><I d={dots} s={16}/></IconButton>
          <span style={{width:8}} />
          <Badge tone="pine">White-label</Badge>
          <Badge tone="mint" height={18}>Desk</Badge>
          <Badge tone="tenantSolid">Selected</Badge>
          <Badge tone="secondary">Clinical psychology</Badge>
          <span style={{width:8}} />
          <StatusPill status="active">Confirmed</StatusPill>
          <StatusPill status="pending">Awaiting intake</StatusPill>
          <StatusPill status="inactive">Paused</StatusPill>
        </div>
      </div>

      <div className="grp">
        <div className="lbl">Card · eyebrow · avatar chip</div>
        <div className="row" style={{alignItems:'stretch'}}>
          <Card style={{flex:1, minWidth:240}}>
            <Eyebrow>Revenue this month</Eyebrow>
            <div style={{display:'flex', alignItems:'center', gap:10, marginTop:10}}>
              <div className="d-stat-hero">₦450,000</div>
              <StatusPill status="active" dot={false} height={22}>+18.2%</StatusPill>
            </div>
          </Card>
          <Card hoverable padding="sm" radius={18} style={{flex:1, minWidth:200}}>
            <div style={{display:'flex', alignItems:'center', gap:12}}>
              <AvatarChip initials="AO" size={38} />
              <div>
                <div className="d-row-title">Adaeze Okonkwo</div>
                <div style={{fontSize:12, color:'var(--desk-text-muted)'}}>Individual · Telehealth</div>
              </div>
            </div>
          </Card>
          <Card dark radius={20} padding="sm" style={{width:150}}>
            <Eyebrow tone="invert">Today</Eyebrow>
            <div style={{fontSize:26, fontWeight:800, letterSpacing:'-0.03em', marginTop:8}}>3</div>
          </Card>
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
<script>
  /* Babel's script-tag transformer doesn't execute here, so compile the demo
     ourselves once the primitives are loaded. */
  loadDeskComponents('../../').then(() => {
    const src = document.getElementById('demo').textContent;
    (0, eval)(Babel.transform(src, { presets: [['react', { runtime: 'classic' }]] }).code);
  });
</script>
</body>
</html>
