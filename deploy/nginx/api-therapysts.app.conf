# The API at its therapysts.app address (spec §4.1b), beside
# api-unclutterdesk.com.conf. Install on the server as
# /etc/nginx/conf.d/api-therapysts.app.conf (docs/runbooks/therapysts-app-move.md).
#
# Same API, same upstream: `unclutterdesk_api` is defined once, in
# api-unclutterdesk.com.conf, and both server blocks proxy to it. Keep that file
# while webhooks and old links still reach api.unclutterdesk.com; remove it only
# when every outside service has the new address.
#
# The certificate is issued for api.therapysts.app before this file is loaded:
#   certbot certonly --webroot -w /var/www/html -d api.therapysts.app
# (with the DNS record DNS-only until the certificate exists, as in README.md).
#
# Everything else matches api-unclutterdesk.com.conf; see the notes there on the
# explicit listen addresses and X-Forwarded-For.

server {
    # Bound addresses on port 80 too: the other sites listen on 169.58.3.186:80,
    # so a plain `listen 80` is never chosen and certbot's challenge 404s
    # (found 17 Nov 2026).
    listen 169.58.3.186:80;
    listen [2a02:c207:2343:4945::1]:80;
    server_name api.therapysts.app;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 169.58.3.186:443 ssl;
    listen [2a02:c207:2343:4945::1]:443 ssl;
    server_name api.therapysts.app;

    ssl_certificate     /etc/letsencrypt/live/api.therapysts.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.therapysts.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    server_tokens off;
    client_max_body_size 5m;

    location / {
        proxy_pass http://unclutterdesk_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;

        proxy_read_timeout 1h;
    }
}
