# The API's server block, exactly as it runs on the server
# /etc/nginx/conf.d/api-unclutterdesk.com.conf (verified 2026-09-30).
#
# listen names the server's IP on purpose: other sites on this machine bind
# to specific addresses, and nginx matches a request to that address only
# against servers that name it. A bare `listen 443` would not be chosen —
# which is what caused the 526/CORS incident on 2026-09-30.
#
# X-Forwarded-For carries $remote_addr alone. With cloudflare-realip.conf
# installed that is the visitor's own address. Appending to the incoming
# chain instead would make the API, which trusts one proxy hop and reads the
# last entry, see a Cloudflare address for every user, so the login rate
# limiter would treat them as a handful of people.
#
# If this file and the server ever disagree, the server wins until synced —
# diff them after any change (see README.md in this folder).

upstream unclutterdesk_api {
    server 127.0.0.1:3050;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.unclutterdesk.com;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 169.58.3.186:443 ssl;
    listen [2a02:c207:2343:4945::1]:443 ssl;
    server_name api.unclutterdesk.com;

    ssl_certificate     /etc/letsencrypt/live/api.unclutterdesk.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.unclutterdesk.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    server_tokens off;
    client_max_body_size 5m;

    location / {
        proxy_pass http://unclutterdesk_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;

        proxy_read_timeout 1h;
    }
}
