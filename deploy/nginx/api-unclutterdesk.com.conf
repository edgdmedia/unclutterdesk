# /etc/nginx/conf.d/api-unclutterdesk.com.conf
#
# The API, served to Cloudflare (and, until the record is proxied, directly to
# browsers — this file works both ways). Needs cloudflare-realip.conf next to
# it so $remote_addr is the visitor, not Cloudflare.
#
# Certificates: this keeps the existing Let's Encrypt paths. Renewal keeps
# working once proxied, because certbot's HTTP check on port 80 is let through
# below. If you switch to a Cloudflare Origin Certificate instead, change the
# two ssl_certificate lines and drop the /.well-known location.
#
# Install:
#   sudo cp /etc/nginx/conf.d/api-unclutterdesk.com.conf ~/api-nginx.backup
#   sudo cp cloudflare-realip.conf api-unclutterdesk.com.conf /etc/nginx/conf.d/
#   sudo nginx -t && sudo systemctl reload nginx
# Roll back: copy ~/api-nginx.backup back, delete cloudflare-realip.conf, reload.

upstream unclutterdesk_api {
    server 127.0.0.1:3050;   # PORT in ecosystem.config.js
    keepalive 16;
}

# Port 80: certificate renewals, and a redirect for everything else.
server {
    listen 80;
    listen [::]:80;
    server_name api.unclutterdesk.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # `listen ... http2` rather than `http2 on;`: the server runs nginx 1.24,
    # and the separate directive only exists from 1.25.1.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.unclutterdesk.com;

    ssl_certificate     /etc/letsencrypt/live/api.unclutterdesk.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.unclutterdesk.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Don't advertise the nginx version.
    server_tokens off;

    # Room for avatar and logo uploads sent as data URLs.
    client_max_body_size 5m;

    # Every proxy_set_header lives in this one location on purpose: nginx
    # replaces inherited proxy_set_header directives rather than merging them,
    # so a location that sets any of its own silently drops the rest.
    location / {
        proxy_pass http://unclutterdesk_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        # $remote_addr is the visitor's own address (see cloudflare-realip.conf).
        # Sent on its own rather than appended to the incoming chain: the API
        # trusts exactly one proxy hop and reads the last entry, so a chain a
        # client wrote itself could otherwise pick the address the rate limiter sees.
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;

        # Live notifications (/v1/notifications/stream) are a long-lived stream.
        # The API already sends X-Accel-Buffering: no; this keeps the connection
        # open longer than nginx's 60s default between events.
        proxy_read_timeout 1h;
    }
}
