# The API's server block, as it runs on the server (checked 2026-09-24),
# with the one change Cloudflare proxying needs: X-Forwarded-For carries
# $remote_addr alone. With cloudflare-realip.conf installed that is the
# visitor's own address. Appending to the incoming chain instead would make
# the API, which trusts one proxy hop and reads the last entry, see a
# Cloudflare address for every user, so the login rate limiter would treat
# them as a handful of people.
#
# listen names the server's IP on purpose: other sites on this machine bind
# to specific addresses, and nginx matches a request to that address only
# against servers that name it. A bare `listen 443` would not be chosen.
#
# Port 80 and certificate renewal are handled elsewhere on the server.

server {
    listen 169.58.3.186:443 ssl;
    server_name api.unclutterdesk.com;

    ssl_certificate     /etc/letsencrypt/live/api.unclutterdesk.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.unclutterdesk.com/privkey.pem;

    client_max_body_size 50m;

    # Every proxy_set_header lives in this one location on purpose: nginx
    # replaces inherited proxy_set_header directives rather than merging them.
    location / {
        proxy_pass http://127.0.0.1:3050;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        # Long-lived notification stream (/v1/notifications/stream).
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
