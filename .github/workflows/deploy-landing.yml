name: Deploy Landing

on:
  push:
    branches:
      - main
    paths:
      - 'apps/landing/**'
      - 'packages/ui/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-landing.yml'

concurrency:
  group: deploy-landing
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Landing To Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build landing
        run: pnpm --filter @unclutterdesk/landing build

      - name: Deploy landing
        working-directory: apps/landing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PAGES_PROJECT: ${{ secrets.CLOUDFLARE_PAGES_LANDING_PROJECT }}
        run: pnpm dlx wrangler pages deploy dist --project-name="$CF_PAGES_PROJECT"
