name: Deploy Legacy Redirects

# Manual only (spec §4.1b). Run once at the domain move, after the tenant
# router's routes on the old zone are deleted (docs/runbooks/therapysts-app-move.md),
# and again only to change a redirect. Never on push: deploying it while the
# router still owns the old routes would fail, and must not race the move.
on:
  workflow_dispatch: {}

concurrency:
  group: deploy-legacy-redirects
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Legacy Redirects To Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # main only: this deploys to production.
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm --filter @therapysts/legacy-redirects test
      - name: Deploy Worker
        working-directory: apps/legacy-redirects
        env:
          # The Unclutter account, which keeps the old zone.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy
