name: Deploy App

on:
  # Manual redeploy without a code change, e.g. after a path-filtered push
  # skipped the deploy.
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - 'apps/app/**'
      - 'packages/shared/**'
      - 'packages/ui/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-app.yml'

concurrency:
  group: deploy-app-${{ github.ref }}
  # Never interrupt a deploy in flight.
  cancel-in-progress: false

jobs:
  deploy:
    # Checks ran on dev (ci.yml); main only deploys. Manual runs redeploy too.
    timeout-minutes: 30
    name: Deploy App To Cloudflare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Until the swap (docs/runbooks/therapysts-app-move.md) the app is built
      # and deployed twice: as today to app.unclutterdesk.com in the Unclutter
      # account, and for therapysts.app in the Therapysts account. After the
      # swap, drop the old pair. The new addresses are public, so they are
      # written here rather than kept in settings.
      - name: Build app (app.unclutterdesk.com)
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_APP_URL: ${{ secrets.VITE_APP_URL }}
        run: pnpm --filter @unclutterdesk/app build

      - name: Deploy app (app.unclutterdesk.com)
        working-directory: apps/app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PAGES_PROJECT: ${{ secrets.CLOUDFLARE_PAGES_APP_PROJECT }}
        run: pnpm dlx wrangler pages deploy dist --project-name="$CF_PAGES_PROJECT"

      # Domain config (spec §4.1a). The practice root must be set, or a
      # practice subdomain on .app finds no practice.
      - name: Build app (therapysts.app)
        env:
          VITE_API_URL: https://api.therapysts.app
          VITE_APP_URL: https://therapysts.app
          VITE_TENANT_ROOT_DOMAIN: therapysts.app
          VITE_MARKETING_URL: https://unclutterdesk.com
          VITE_PROFILE_PUBLIC_URL: https://therapysts.com
        run: pnpm --filter @unclutterdesk/app build

      - name: Deploy app (therapysts.app)
        working-directory: apps/app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.THERAPYSTS_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.THERAPYSTS_CLOUDFLARE_ACCOUNT_ID }}
        # A Worker with static assets (apps/app/wrangler.jsonc), not Pages.
        run: pnpm dlx wrangler deploy
