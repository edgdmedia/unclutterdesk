name: Deploy App

on:
  # Manual redeploy without a code change, e.g. after a path-filtered push
  # skipped the deploy.
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - 'apps/app/**'
      - 'packages/shared/**'
      - 'packages/ui/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-app.yml'

concurrency:
  group: deploy-app-${{ github.ref }}
  # Never interrupt a deploy in flight.
  cancel-in-progress: false

jobs:
  deploy:
    # Checks ran on dev (ci.yml); main only deploys. Manual runs redeploy too.
    timeout-minutes: 30
    name: Deploy App To Cloudflare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The app lives on therapysts.app, in the Therapysts account.
      # The practice root must be set, or a practice subdomain on .app finds
      # no practice (spec §4.1a).
      - name: Build app (therapysts.app)
        env:
          VITE_API_URL: https://api.therapysts.app
          VITE_APP_URL: https://therapysts.app
          VITE_TENANT_ROOT_DOMAIN: therapysts.app
          VITE_MARKETING_URL: https://therapysts.com
          VITE_PROFILE_PUBLIC_URL: https://therapysts.com
        run: pnpm --filter @therapysts/app build

      - name: Deploy app (therapysts.app)
        working-directory: apps/app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.THERAPYSTS_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.THERAPYSTS_CLOUDFLARE_ACCOUNT_ID }}
        # A Worker with static assets (apps/app/wrangler.jsonc), not Pages.
        run: pnpm dlx wrangler deploy
