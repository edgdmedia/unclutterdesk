name: Deploy App

on:
  # Manual redeploy without a code change, e.g. after a path-filtered push
  # skipped the deploy.
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - 'apps/app/**'
      - 'packages/shared/**'
      - 'packages/ui/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-app.yml'

concurrency:
  group: deploy-app-${{ github.ref }}
  # Never interrupt a deploy in flight.
  cancel-in-progress: false

jobs:
  deploy:
    # Checks ran on dev (ci.yml); main only deploys. Manual runs redeploy too.
    timeout-minutes: 30
    name: Deploy App To Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_APP_URL: ${{ secrets.VITE_APP_URL }}
        run: pnpm --filter @unclutterdesk/app build

      - name: Deploy app
        working-directory: apps/app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PAGES_PROJECT: ${{ secrets.CLOUDFLARE_PAGES_APP_PROJECT }}
        run: pnpm dlx wrangler pages deploy dist --project-name="$CF_PAGES_PROJECT"
