name: CI

# Every check runs here, on dev: on PRs into dev and on pushes to dev.
# main receives only dev merges and only deploys (deploy-*.yml).
on:
  workflow_dispatch: {}
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck & Test
    runs-on: ubuntu-latest
    # A hung step fails in minutes, not after GitHub's six-hour default.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma Client
        run: pnpm exec prisma generate --schema prisma/schema.prisma
      - name: Typecheck
        run: pnpm --recursive run typecheck
      - name: Test
        run: >-
          pnpm --filter @unclutterdesk/api test &&
          pnpm --filter @unclutterdesk/ui test &&
          pnpm --filter @unclutterdesk/app test &&
          pnpm --filter @unclutterdesk/tenant-router test &&
          pnpm --filter @unclutterdesk/profiles test
      # §6.16: the tenant router and the built profiles Worker together in
      # workerd (wrangler dev), joined by the PROFILES service binding; only
      # the API is faked. Builds the profiles Worker first.
      - name: Solo practice home page in the Workers runtime
        run: pnpm --filter @unclutterdesk/profiles test:workerd

  accessibility:
    name: Accessibility (Lighthouse ≥ 95, axe no serious/critical)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Generate Prisma Client
        run: pnpm exec prisma generate --schema prisma/schema.prisma
      - name: Run accessibility tests
        run: pnpm --filter @unclutterdesk/profiles test:a11y
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-logs
          path: apps/profiles/a11y/.logs/
