name: Deploy API

on:
  push:
    branches:
      - main
    paths:
      - 'apps/api/**'
      - 'prisma/**'
      - 'deploy.sh'
      - 'ecosystem.config.js'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-api.yml'

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy API To Server
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Deploy API over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          SEED_DB: "false"
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          envs: SEED_DB
          script: |
            cd /home/unclutterdesk/app
            git pull origin main
            chmod +x deploy.sh
            ./deploy.sh
