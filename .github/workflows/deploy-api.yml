name: Deploy API

on:
  push:
    branches:
      - main
    paths:
      - 'apps/api/**'
      - 'prisma/**'
      - 'deploy.sh'
      - 'ecosystem.config.js'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-api.yml'
  # Also on PRs, so `verify` reports a check before the merge rather
  # than after the deploy has already started.
  pull_request:
    branches:
      - main
    paths:
      - 'apps/api/**'
      - 'prisma/**'
      - 'deploy.sh'
      - 'ecosystem.config.js'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-api.yml'

concurrency:
  group: deploy-api-${{ github.ref }}
  # Never interrupt a deploy in flight; a superseded PR check is fine to drop.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Typecheck & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm exec prisma generate --schema prisma/schema.prisma

      - name: Typecheck
        run: pnpm --recursive run typecheck

      - name: Test
        run: pnpm --filter @unclutterdesk/api test && pnpm --filter @unclutterdesk/app test && pnpm --filter @unclutterdesk/tenant-router test

  deploy:
    needs: verify
    if: github.event_name == 'push'
    name: Deploy API To Server
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Deploy API over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          SEED_DB: "false"
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          envs: SEED_DB
          script: |
            cd /home/unclutterdesk/app
            git pull origin main
            chmod +x deploy.sh
            ./deploy.sh
