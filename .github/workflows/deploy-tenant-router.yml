name: Deploy Tenant Router

on:
  push:
    branches:
      - main
    paths:
      - 'apps/tenant-router/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-tenant-router.yml'

concurrency:
  group: deploy-tenant-router-${{ github.ref }}
  # Never interrupt a deploy in flight.
  cancel-in-progress: false

jobs:
  deploy:
    # Checks ran on dev (ci.yml); main only deploys. Manual runs redeploy too.
    timeout-minutes: 30
    name: Deploy Tenant Router To Cloudflare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy Worker
        working-directory: apps/tenant-router
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy
